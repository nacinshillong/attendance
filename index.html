<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NACIN Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4 font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-1 text-center text-gray-800">NACIN Shillong</h2>
        
        <!-- Displays which session they are checking into -->
        <p id="sessionDisplay" class="text-center text-blue-600 font-bold mb-6 text-md tracking-wide">Loading Session...</p>
        
        <label class="block text-gray-700 text-sm font-bold mb-2" for="empId">Employee ID / Name</label>
        <input type="text" id="empId" placeholder="Enter ID..." class="w-full border border-gray-300 p-3 mb-6 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        
        <button id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
            Verify Location & Submit
        </button>
        
        <div id="status" class="mt-6 text-sm text-center font-medium min-h-[1.5rem]"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_APPS_SCRIPT_ID/exec";
        // ---------------------

        // Extract parameters on load
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const sessionName = urlParams.get('session') || "Unknown Session";
        
        document.getElementById('sessionDisplay').innerText = sessionName;

        document.getElementById('submitBtn').addEventListener('click', () => {
            const empId = document.getElementById('empId').value.trim();
            const statusText = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!empId) {
                statusText.innerText = "Please enter your Employee ID.";
                statusText.className = "mt-6 text-sm text-center font-medium text-red-600";
                return;
            }

            // NEW DEVICE LOCK: Date + Session (e.g., "Nov 06 2026_Morning")
            const today = new Date().toDateString();
            const lockKey = `nacin_attendance_${today}_${sessionName}`;

            if (localStorage.getItem(lockKey)) {
                statusText.innerText = `You have already logged attendance for the ${sessionName} today.`;
                statusText.className = "mt-6 text-sm text-center font-bold text-red-600";
                return;
            }

            if (!token) {
                statusText.innerText = "Invalid QR code. Please scan the projector again.";
                statusText.className = "mt-6 text-sm text-center font-medium text-red-600";
                return;
            }

            statusText.innerText = "Acquiring GPS coordinates (please wait)...";
            statusText.className = "mt-6 text-sm text-center font-medium text-blue-600";
            submitBtn.disabled = true;
            submitBtn.classList.add("opacity-50", "cursor-not-allowed");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    statusText.innerText = "GPS acquired. Verifying with server...";
                    
                    const payload = {
                        empId: empId,
                        token: token,
                        session: sessionName, // Sending the session to the backend
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    };

                    fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            statusText.innerText = "✅ " + data.message;
                            statusText.className = "mt-6 text-sm text-center font-bold text-green-600";
                            localStorage.setItem(lockKey, 'true'); // Lock device for this specific session
                        } else {
                            statusText.innerText = "❌ " + data.message;
                            statusText.className = "mt-6 text-sm text-center font-bold text-red-600";
                            submitBtn.disabled = false;
                            submitBtn.classList.remove("opacity-50", "cursor-not-allowed");
                        }
                    })
                    .catch(error => {
                        statusText.innerText = "Network error communicating with the server.";
                        statusText.className = "mt-6 text-sm text-center font-bold text-red-600";
                        submitBtn.disabled = false;
                        submitBtn.classList.remove("opacity-50", "cursor-not-allowed");
                    });
                },
                (error) => {
                    statusText.innerText = "❌ GPS Error: You must allow location access.";
                    statusText.className = "mt-6 text-sm text-center font-bold text-red-600";
                    submitBtn.disabled = false;
                    submitBtn.classList.remove("opacity-50", "cursor-not-allowed");
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });
    </script>
</body>
</html>
