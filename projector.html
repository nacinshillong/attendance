<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NACIN QR Attendance</title>
    <!-- Lightweight QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f3f4f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 { color: #1f2937; margin-bottom: 20px; }
        #qrcode { margin: 0 auto; display: flex; justify-content: center; }
        #timer-text { font-size: 1.2rem; color: #4b5563; margin-top: 20px; }
        #timer { font-size: 2.5rem; color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scan to Mark Attendance</h1>
        <div id="qrcode"></div>
        <div id="timer-text">QR code refreshes in:</div>
        <div id="timer">30</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // REPLACE this with your actual GitHub Pages URL for index.html
        const studentFormUrl = "https://YOUR_GITHUB_USERNAME.github.io/nacin-attendance/index.html";
        
        // This must exactly match the SECRET_KEY in your Google Apps Script
        const secretKey = "NACIN_SECRET_KEY"; 
        const bucketSize = 30000; // 30 seconds
        // ---------------------

        let qrcode = new QRCode(document.getElementById("qrcode"), { 
            width: 300, 
            height: 300,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        function generateToken() {
            const timeBucket = Math.floor(Date.now() / bucketSize);
            const rawToken = secretKey + "_" + timeBucket;
            
            // Encode to match Apps Script's Utilities.base64Encode
            const token = btoa(rawToken); 
            const fullUrl = `${studentFormUrl}?token=${token}`;
            
            qrcode.clear();
            qrcode.makeCode(fullUrl);
            console.log("Generated URL:", fullUrl); // Useful for debugging
        }

        function updateLoop() {
            const now = Date.now();
            const timeRemaining = bucketSize - (now % bucketSize);
            
            document.getElementById("timer").innerText = Math.ceil(timeRemaining / 1000);

            // Generate new QR right when the bucket rolls over
            if (timeRemaining > bucketSize - 1000) {
                generateToken();
            }
            
            requestAnimationFrame(updateLoop);
        }

        // Start the loop
        generateToken();
        updateLoop();
    </script>
</body>
</html>
