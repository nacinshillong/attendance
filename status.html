<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NACIN Attendance Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans text-gray-800">

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold mb-2 text-center">My Attendance</h2>
        <p class="text-center text-gray-500 mb-6 text-sm">Check your records and percentage</p>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="searchId" placeholder="Enter Employee ID..." class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                Search
            </button>
        </div>

        <div id="loading" class="hidden text-center text-blue-600 font-medium my-4">Fetching records...</div>
        <div id="errorMsg" class="hidden text-center text-red-600 font-medium my-4"></div>

        <!-- Results Section -->
        <div id="results" class="hidden">
            <div class="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-100">
                <div class="text-center">
                    <span class="block text-sm text-gray-600 uppercase tracking-wide">Overall Attendance</span>
                    <span id="percentageText" class="block text-4xl font-bold text-blue-700 my-1">0%</span>
                    <span id="fractionText" class="text-sm text-gray-500">0 / 0 Sessions</span>
                </div>
            </div>

            <h3 class="font-bold text-gray-700 mb-3 border-b pb-2">Log History</h3>
            <ul id="logList" class="space-y-2 max-h-64 overflow-y-auto pr-2">
                <!-- Records injected here by JavaScript -->
            </ul>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // REPLACE this with the EXACT SAME Web App URL (/exec) from Google Apps Script
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_APPS_SCRIPT_ID/exec";
        // ---------------------

        document.getElementById('searchBtn').addEventListener('click', () => {
            const empId = document.getElementById('searchId').value.trim();
            if (!empId) return;

            // UI Resets
            document.getElementById('results').classList.add('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            const logList = document.getElementById('logList');
            logList.innerHTML = '';

            // Using GET request with URL parameters
            const fetchUrl = `${APPS_SCRIPT_URL}?empId=${encodeURIComponent(empId)}`;

            fetch(fetchUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                
                if (data.success) {
                    if (data.records.length === 0) {
                        document.getElementById('errorMsg').innerText = "No attendance records found for this ID.";
                        document.getElementById('errorMsg').classList.remove('hidden');
                        return;
                    }

                    // Populate Data
                    document.getElementById('percentageText').innerText = data.percentage + "%";
                    document.getElementById('fractionText').innerText = `${data.totalAttended} / ${data.requiredScans} Sessions logged`;

                    // Build list items (looping backwards to show newest first)
                    for (let i = data.records.length - 1; i >= 0; i--) {
                        const li = document.createElement('li');
                        li.className = "flex justify-between items-center bg-gray-50 p-3 rounded border text-sm";
                        li.innerHTML = `
                            <span class="font-medium">${data.records[i].time}</span>
                            <span class="text-green-600 font-bold bg-green-100 px-2 py-1 rounded text-xs">✅ ${data.records[i].status}</span>
                        `;
                        logList.appendChild(li);
                    }

                    document.getElementById('results').classList.remove('hidden');
                } else {
                    document.getElementById('errorMsg').innerText = "Error: " + data.message;
                    document.getElementById('errorMsg').classList.remove('hidden');
                }
            })
            .catch(error => {
                console.error(error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorMsg').innerText = "Network error. Make sure your Apps Script URL is correct.";
                document.getElementById('errorMsg').classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
